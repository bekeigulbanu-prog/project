<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач (CRUD + API)</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>

    <div class="container">
        <div class="page-head">
            <h1>Менеджер задач (CRUD + API)</h1>
            <button class="btn btn-gold" id="openAddBtn">＋ Добавить задачу</button>
        </div>

        <!-- Загрузка задач по ссылке -->
        <div class="card">
            <div class="card-head">
                <div>
                    <h3>Загрузка задач</h3>
                    <p class="muted">Введите ссылку на API или выберите готовый пример.</p>
                </div>
                <button class="btn btn-gold" onclick="loadFromApi()">Загрузить задачи ↓</button>
            </div>

            <label for="apiUrl" class="muted">Ссылка на API</label>
            <input type="url" id="apiUrl" value="https://dummyjson.com/todos" autocomplete="off">

            <p class="muted hint">
                Сюда нужно ввести не ключ API, а HTTPS-ссылку, которая отдаёт задачи.
                API должен разрешать загрузку из браузера.
            </p>

            <div class="row">
                <button class="btn btn-outline" onclick="usePreset('dummy')">DummyJSON</button>
            </div>

            <p id="status" class="status"></p>
            <p id="apiLog" class="api-log"></p>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat"><span>Всего</span><strong id="totalCount">0</strong></div>
            <div class="stat"><span>Выполнено</span><strong id="completedCount" class="green">0</strong></div>
            <div class="stat"><span>Не выполнено</span><strong id="pendingCount" class="red">0</strong></div>
        </div>

        <!-- Список задач -->
        <div class="card">
            <h3>Все задачи <span class="badge" id="shownBadge">0 / 0</span></h3>

            <div class="controls">
                <div>
                    <label for="searchInput" class="muted">Поиск по названию</label>
                    <input type="text" id="searchInput" placeholder="Введите название задачи" autocomplete="off">
                </div>
                <div>
                    <label for="sortSel" class="muted">Сортировка (через API)</label>
                    <select id="sortSel">
                        <option value="">Без сортировки</option>
                        <option value="todo:asc">Текст: А → Я</option>
                        <option value="todo:desc">Текст: Я → А</option>
                        <option value="userId:asc">По пользователю</option>
                        <option value="completed:desc">Сначала выполненные</option>
                    </select>
                </div>
                <div>
                    <label for="authorFilter" class="muted">Автор</label>
                    <select id="authorFilter">
                        <option value="all">Все авторы</option>
                    </select>
                </div>
                <div class="controls-btn">
                    <button class="btn btn-outline" id="resetBtn">Сбросить</button>
                </div>
            </div>

            <div class="row filters">
                <button class="chip" data-filter="all">Все</button>
                <button class="chip" data-filter="done">Выполненные</button>
                <button class="chip" data-filter="pending">Не выполненные</button>
            </div>

            <p id="shownInfo" class="muted shown-info"></p>

            <ul id="todoList"></ul>
        </div>
    </div>

    <!-- Окно «Новая задача» / «Изменить задачу» -->
    <div class="overlay" id="addOverlay" hidden>
        <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="taskFormTitle">
            <button class="btn btn-outline btn-sm close" id="addCloseBtn" aria-label="Закрыть">✕</button>
            <h3 id="taskFormTitle">Новая задача</h3>

            <label class="field" for="todoInput">Текст задачи</label>
            <textarea id="todoInput" rows="4" placeholder="Что нужно сделать?"></textarea>

            <label class="field" for="authorSel">Автор</label>
            <select id="authorSel">
                <option value="1">Пользователь #1</option>
            </select>

            <label class="field" for="statusSel">Статус</label>
            <select id="statusSel">
                <option value="pending">Не выполнено</option>
                <option value="done">Выполнено</option>
            </select>

            <p id="addMsg" class="status error"></p>

            <div class="form-actions">
                <button class="btn btn-gold" id="taskSubmitBtn">Добавить</button>
                <button class="btn btn-outline" id="taskCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Окно профиля пользователя -->
    <div class="overlay" id="overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-label="Профиль пользователя">
            <button class="btn btn-outline btn-sm close" id="closeBtn" aria-label="Закрыть">✕</button>
            <div id="profileBody"></div>
        </div>
    </div>

    <script src="task.js"></script>
</body>
</html>
