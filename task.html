<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач (CRUD + API)</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>

    <div class="container">
        <h1>Менеджер задач (CRUD + API)</h1>

        <!-- Загрузка задач по ссылке и пресеты -->
        <div class="card">
            <div class="card-head">
                <div>
                    <h3>Загрузка задач</h3>
                    <p class="muted">Введите ссылку на API или выберите готовый пример.</p>
                </div>
                <button class="btn btn-gold" onclick="loadFromApi()">Загрузить задачи ↓</button>
            </div>

            <label for="apiUrl" class="muted">Ссылка на API</label>
            <input type="url" id="apiUrl" value="https://dummyjson.com/todos" autocomplete="off">

            <div class="row" style="margin-top: 12px;">
                <button class="btn btn-outline" onclick="usePreset('dummy')">DummyJSON</button>
                <button class="btn btn-outline" onclick="usePreset('placeholder')">JSONPlaceholder</button>
                <button class="btn btn-outline" onclick="usePreset('gorest')">Go REST</button>
                <button class="btn btn-outline" onclick="addRandomTask()">Случайная задача</button>
            </div>

            <p id="status" class="status"></p>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat"><span>Всего</span><strong id="totalCount">0</strong></div>
            <div class="stat"><span>Выполнено</span><strong id="completedCount" class="green">0</strong></div>
            <div class="stat"><span>Не выполнено</span><strong id="pendingCount" class="red">0</strong></div>
        </div>

        <!-- Список задач -->
        <div class="card">
            <h3>Мои задачи</h3>

            <div class="row no-margin">
                <input type="text" id="todoInput" placeholder="Новая задача..." autocomplete="off">
                <button class="btn btn-gold" onclick="addTodo()">Добавить</button>
            </div>

            <!-- Поиск и Сортировка через API -->
            <div class="row search-sort-row">
                <input type="text" id="searchInput" placeholder="Поиск по запросу..." oninput="handleSearch()">
                <select id="sortSelect" class="btn btn-outline" onchange="handleSortApi()">
                    <option value="default">Сортировка API...</option>
                    <option value="todo-asc">По названию (A-Z)</option>
                    <option value="todo-desc">По названию (Z-A)</option>
                    <option value="completed-asc">Сначала невыполненные</option>
                    <option value="completed-desc">Сначала выполненные</option>
                </select>
            </div>

            <div class="row filters">
                <button class="chip" data-filter="all">Все</button>
                <button class="chip" data-filter="done">Выполненные</button>
                <button class="chip" data-filter="pending">Не выполненные</button>
            </div>

            <ul id="todoList"></ul>
        </div>
    </div>

    <!-- Всплывающее модальное окно с информацией о пользователе -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="modal-body-flex">
                <div class="modal-left">
                    <img id="modalAvatar" src="" alt="Аватар" class="modal-avatar">
                    <div id="modalNick" class="modal-nick-sub">@nick</div>
                    <h4 id="modalName">ФИО</h4>
                    <p class="muted"><strong>Компания:</strong> <span id="modalWork"></span></p>
                    <p class="muted"><strong>Должность:</strong> <span id="modalRole"></span></p>
                    <p class="muted"><strong>Город:</strong> <span id="modalCity"></span></p>
                    <p class="muted"><strong>Email:</strong> <span id="modalEmail"></span></p>
                    <p class="muted"><strong>Телефон:</strong> <span id="modalPhone"></span></p>
                </div>

                <div class="modal-right">
                    <h4>Задачи пользователя:</h4>
                    <ul id="modalTaskList" class="simple-task-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="task.js"></script>
</body>
</html>
